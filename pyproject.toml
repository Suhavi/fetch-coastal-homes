[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-coastal-homes"
version = "0.1.0"
description = "FETCH (Flexible Elevation Timing for Coastal Homes) is decision-support software for coastal flood adaptation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.23,<1",
    "bottleneck",
    "dask",
    "matplotlib",
    "netCDF4",
    "numpy",
    "pymc>=5.28,<6",
    "requests",
    "scipy",
    "seaborn",
    "xarray",
]
keywords = [
    "climate adaptation",
    "coastal flooding",
    "decision making under deep uncertainty",
    "flood risk",
    "home elevation",
    "sea level rise",
    "storm surge",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Suhavi/fetch-coastal-homes"
Repository = "https://github.com/Suhavi/fetch-coastal-homes"
Issues = "https://github.com/Suhavi/fetch-coastal-homes/issues"

[tool.setuptools.packages.find]
include = ["src*"]
